version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: meeting_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - meeting_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: meeting_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - meeting_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # RabbitMQ event bus
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: meeting_rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: samvaad
      RABBITMQ_DEFAULT_PASS: samvaad123
      RABBITMQ_DEFAULT_VHOST: /
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - meeting_network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Test SMTP inbox for local email invites
  mailpit:
    image: axllent/mailpit:latest
    container_name: meeting_mailpit
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - meeting_network

  ollama:
    image: ollama/ollama:latest
    container_name: meeting_ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - meeting_network

  meeting-intelligence:
    build:
      context: ./src/Services/MeetingIntelligenceService
    container_name: meeting_intelligence
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: samvaad
      RABBITMQ_PASSWORD: samvaad123
      MEETING_SERVICE_URL: http://host.docker.internal:5002
      INTERNAL_API_KEY: local-development-only-internal-service-key
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: qwen2.5:3b
      WHISPER_MODEL: base
      WHISPER_DEVICE: cpu
      WHISPER_COMPUTE_TYPE: int8
    depends_on:
      rabbitmq:
        condition: service_healthy
      ollama:
        condition: service_started
    networks:
      - meeting_network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  rabbitmq_data:
    driver: local
  ollama_data:
    driver: local

networks:
  meeting_network:
    driver: bridge
